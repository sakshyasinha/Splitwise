<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SplitSense</title>
    <script>
      const target = location.pathname + location.search + location.hash;
      // GitHub Pages serves the app under /<repo>/.
      // Use the same directory as the current page so casing mismatches don't break reloads.
      const base = location.pathname.replace(/\/[^/]*$/, '');
      // If we're already at /<repo>/404.html then base becomes /<repo>/.
      location.replace(base + '/index.html?redirect=' + encodeURIComponent(target));


    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>

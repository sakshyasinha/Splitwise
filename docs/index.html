<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Splitwise Clone</title>
    <script>
      const params = new URLSearchParams(location.search);
      const redirect = params.get('redirect');
      if (redirect) {
        // Fix cases where redirect accidentally points to /<repo>index.html (missing '/')
        // e.g. /Splitwiseindex.html?redirect=...
        // Normalize to /<repo>/index.html.
        const normalized = redirect.replace(/\/([^/]+)index\.html(\?|#|$)/, '/$1/index.html$2');
        history.replaceState(null, '', normalized);
      }


      // Normalize deep-link reloads on GitHub Pages.
      // If the rewritten path still points at a missing file, bounce back to this index.
      // (Keeps existing SPA behavior but prevents GitHub Pages 404s.)
      window.addEventListener('error', () => {});

    </script>
    <script type="module" crossorigin src="/assets/index.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index.css">
  </head>
  <body>
    <div id="root"></div>

  </body>
</html>
